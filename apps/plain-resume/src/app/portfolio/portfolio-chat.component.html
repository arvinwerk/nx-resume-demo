<section class="chat-panel" aria-label="Portfolio conversation">
  <div class="chat-heading">
    <p>Chat</p>
  </div>

  <div
    class="chat-body"
    [class.is-empty]="messages.length === 0 && !pending"
    #log
    role="log"
    aria-live="polite"
    aria-relevant="additions"
    [attr.aria-busy]="busy">
    <article class="chat-message" *ngFor="let message of messages" [attr.data-role]="message.role">
      <p class="message-label">{{ message.role === 'user' ? 'You' : catalog.profile.name }}</p>
      <p>{{ message.content }}</p>
    </article>
    <div class="chat-pending" *ngIf="pending" data-role="thinking" role="status">
      <span class="sr-only">Thinking</span>
      <span class="think-row" aria-hidden="true">
        <span class="think-label">{{ thinkLabel }}</span>
        <span class="think-dots"><span></span><span></span><span></span></span>
      </span>
      <span class="think-track" aria-hidden="true"><span></span></span>
    </div>
  </div>

  <p class="chat-prompt" id="portfolio-ask">What would you like to know about me?</p>

  <div class="chat-prompts" *ngIf="prompts.length > 0">
    <button
      type="button"
      class="starter"
      data-role="conversation-starter"
      *ngFor="let prompt of prompts"
      [disabled]="busy"
      (click)="choose(prompt)">
      {{ prompt }}
    </button>
  </div>

  <form class="chat-form" (submit)="submit($event)">
    <label class="sr-only" for="portfolio-question">Ask about this portfolio</label>
    <input
      id="portfolio-question"
      name="question"
      type="text"
      maxlength="500"
      autocomplete="off"
      placeholder="Ask about a project, a skill, or the work"
      [value]="draft"
      [disabled]="busy"
      (input)="updateDraft($event)" />
    <button type="submit" class="send-button" [disabled]="!canSend()">Send</button>
  </form>
  <p class="chat-caption">Answers stay inside this portfolio. The page only changes through layout, filters, and emphasis.</p>
</section>
