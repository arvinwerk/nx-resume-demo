<div>
  <div
    data-role="project"
    *ngFor="let project of projects; trackBy: trackProject"
    [class.is-highlighted]="isHighlighted(project)">
    <h2>{{ project.title }}</h2>
    <small>{{ project.company }}</small>
    <p *ngIf="project.keywords.length">{{ project.keywords.join(', ') }}</p>
    <p [innerHTML]="project.shortDescription"></p>
    <p
      *ngIf="detailLevel === 'detailed' && project.longDescription"
      data-type="longDescription"
      [innerHTML]="project.longDescription"></p>
  </div>
  <p *ngIf="showEmpty">No projects match the current filter.</p>
</div>
