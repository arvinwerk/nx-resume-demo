<ol class="project-list">
  <li *ngFor="let project of projects; let i = index; trackBy: trackProject">
    <article data-role="project" [class.is-highlighted]="isHighlighted(project)">
      <span class="project-index">{{ pad(i) }}</span>
      <div>
        <p class="eyebrow">{{ project.company }}</p>
        <h2>{{ project.title }}</h2>
        <div class="project-copy" [innerHTML]="project.shortDescription"></div>
        <div
          *ngIf="detailLevel === 'detailed' && project.longDescription"
          data-type="longDescription"
          [innerHTML]="project.longDescription"></div>
        <ul class="project-keywords" *ngIf="project.keywords.length">
          <li *ngFor="let keyword of project.keywords" [class.is-hot]="isHot(keyword)">{{ keyword }}</li>
        </ul>
      </div>
    </article>
  </li>
</ol>
<p class="empty-note" *ngIf="showEmpty">No projects match the current filter.</p>
