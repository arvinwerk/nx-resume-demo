<div>
  <button
    type="button"
    data-role="keyword-filter"
    *ngFor="let keyword of keywordOptions"
    [ngStyle]="{background: keyword.selected ? '#ff0000' : '#ededed'}"
    [class.is-selected]="keyword.selected"
    [class.is-highlighted]="isHighlighted(keyword.key)"
    [attr.aria-pressed]="keyword.selected"
    (click)="toggleKeyword(keyword)">
    {{ keyword.key }}
  </button>
</div>
